[package]
name = "bigcalc"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
malachite = { version = "0.14", default-features = false, features = ["std", "naturals_and_integers"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
